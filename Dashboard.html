<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-paneles {
            display: grid;
            grid-template-columns: repeat(2, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .dashboard-paneles img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            display: block;
        }
    </style>
</head>

<body class="dashboard">
    <header class="dashboard-header">
        <h1>Sistema de Gestión de Cursos</h1>
        <nav class="dashboard-nav">
            <ul>
                <li><a href="Dashboard.html">Inicio</a></li>
                <li><a href="Estudiantes.html">Estudiantes</a></li>
                <li><a href="Cursos.html">Cursos</a></li>
                <li><a href="Matriculas.html">Matriculas</a></li>
            </ul>
        </nav>
        <footer class="dashboard-footer-sidebar">
            <p>Jose Rodriguez</p>
            <p>jorodriguez@cesde.net</p>
        </footer>
    </header>

    <main class="dashboard-main">
        <header class="dashboard-topbar">
            <h2>Sistema de Gestión de Cursos</h2>
        </header>

        <section class="dashboard-content">
            <header class="section-header">
                <div>
                    <h1>Dashboard</h1>
                    <p>Resumen general del sistema</p>
                </div>
            </header>

            <div class="dashboard-cards">
                <article class="card">
                    <h2 class="tarjeta1">Estudiantes</h2>
                    <p>3</p>
                </article>
                <article class="card">
                    <h2 class="tarjeta2">Cursos</h2>
                    <p>2</p>
                </article>
                <article class="card">
                    <h2 class="tarjeta3">Matriculas</h2>
                    <p>4</p>
                </article>
            </div>

            <div class="dashboard-paneles">
                <img src="img/matriculas-por-estado.png" alt="Matrículas por estado">
                <img src="img/cursos-populares.png" alt="Cursos populares">
            </div>
        </section>

        <footer class="dashboard-footer-main">
            <p>© 2026 Sistema de Gestión de Cursos</p>
        </footer>
    </main>
</body>

</html>
